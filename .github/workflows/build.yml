name: build

on:
  push:
    branches: [main, master]
    tags: ['v.*']
    paths-ignore: ['**.md', 'bin/i18n/**', 'images/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME_SHORT: memreduct
  APP_NAME: Mem Reduct

jobs:
  build:
    permissions:
      contents: read
      actions: write
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          path: memreduct

      - name: Checkout routine
        uses: actions/checkout@v4
        with:
          repository: henrypp/routine
          ref: 1acd9394395b7cee9e1ea7b985fb54e76be86b11
          path: routine

      - name: Checkout builder
        uses: actions/checkout@v4
        with:
          repository: henrypp/builder
          ref: 124afc79ce0462170d66df1922be5944dea85dfb
          path: builder

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path memreduct/src/app.h -Pattern 'APP_VERSION\s+L"([0-9.]+)"' | Select-Object -First 1
          if (-not $match) { Write-Error 'APP_VERSION not found in src/app.h'; exit 1 }
          "version=$($match.Matches[0].Groups[1].Value)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[18.0,19.0)'

      - name: Build x64
        shell: cmd
        working-directory: memreduct
        run: msbuild memreduct.sln -property:Configuration=Release -property:Platform=x64 -property:OutDir=bin\64\ -property:IntDir=obj\64\ -verbosity:minimal

      - name: Build ARM64
        shell: cmd
        working-directory: memreduct
        run: msbuild memreduct.sln -property:Configuration=Release -property:Platform=ARM64 -property:OutDir=bin\arm64\ -property:IntDir=obj\arm64\ -verbosity:minimal

      - name: Show binaries
        shell: pwsh
        run: Get-ChildItem -Recurse memreduct/bin -Include *.exe, *.pdb | Select-Object FullName, Length

      - name: Install packaging tools
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
          "C:\Program Files\7-Zip" | Out-File -FilePath $env:GITHUB_PATH -Append
          pip install --quiet chardet

      - name: Package
        shell: pwsh
        working-directory: builder
        run: |
          python src/build_package.py --name-short=$env:APP_NAME_SHORT --version=${{ steps.version.outputs.version }} --name="$env:APP_NAME"

      - name: Create portable zip
        shell: pwsh
        run: |
          $stage = Join-Path $env:TEMP 'builder\memreduct'
          $desktop = Join-Path $env:USERPROFILE 'Desktop'
          $zip = Join-Path $desktop ("memreduct-${{ steps.version.outputs.version }}-bin.zip")
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          Get-ChildItem $desktop -Filter 'memreduct-*' | Select-Object Name, Length

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $desktop = Join-Path $env:USERPROFILE 'Desktop'
          $version = '${{ steps.version.outputs.version }}'
          foreach ($pattern in @("memreduct-$version-setup.exe", "memreduct-$version-bin.zip")) {
            $found = Get-ChildItem -Path $desktop -Filter $pattern -ErrorAction SilentlyContinue
            if ($found) { Copy-Item $found.FullName dist/ -Force }
          }
          Get-ChildItem dist

      - name: Publish update manifest line
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $setup = Join-Path (Get-Location) "dist/memreduct-$version-setup.exe"
          if (-not (Test-Path $setup)) { Write-Error "missing $setup"; exit 1 }
          $sha = (Get-FileHash -Path $setup -Algorithm SHA256).Hash.ToLower()
          # the release asset lives under the tag name, which is always "v." + APP_VERSION
          $line = "memreduct=$version|https://github.com/$env:GITHUB_REPOSITORY/releases/download/v.$version/memreduct-$version-setup.exe|$sha;"
          Write-Host $line
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### VERSION line (installer is verified against this sha256)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $line
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Paste this line into VERSION on branch main after pushing the v.$version tag."

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: memreduct-${{ steps.version.outputs.version }}-windows
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v.')
    permissions:
      contents: write
      actions: read
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path src/app.h -Pattern 'APP_VERSION\s+L"([0-9.]+)"' | Select-Object -First 1
          if (-not $match) { Write-Error 'APP_VERSION not found in src/app.h'; exit 1 }
          "version=$($match.Matches[0].Groups[1].Value)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: memreduct-${{ steps.version.outputs.version }}-windows
          path: dist

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$env:GITHUB_REF_NAME" --verify-tag --title "Mem Reduct ${{ steps.version.outputs.version }}" --generate-notes --latest (Get-ChildItem dist -File).FullName
