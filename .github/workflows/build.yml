name: build

on:
  push:
    branches: [main, master]
    tags: ['v.*']
    paths-ignore: ['**.md', 'bin/i18n/**', 'images/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME_SHORT: memreduct
  APP_NAME: Mem Reduct

jobs:
  build:
    permissions:
      contents: read
      actions: write
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          path: memreduct

      - name: Checkout routine
        uses: actions/checkout@v4
        with:
          repository: henrypp/routine
          ref: 1acd9394395b7cee9e1ea7b985fb54e76be86b11
          path: routine

      - name: Checkout builder
        uses: actions/checkout@v4
        with:
          repository: henrypp/builder
          ref: 124afc79ce0462170d66df1922be5944dea85dfb
          path: builder

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path memreduct/src/app.h -Pattern 'APP_VERSION\s+L"([0-9.]+)"' | Select-Object -First 1
          if (-not $match) { Write-Error 'APP_VERSION not found in src/app.h'; exit 1 }
          $version = $match.Matches[0].Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          # the installer url is built from APP_VERSION, so a disagreeing tag would break every self-update
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v.$version") {
            Write-Error "tag '$($env:GITHUB_REF_NAME)' does not match v.$version (APP_VERSION)"
            exit 1
          }

      - name: Check locale pack
        shell: pwsh
        run: |
          if (-not (Test-Path memreduct/bin/memreduct.lng)) { Write-Error 'memreduct/bin/memreduct.lng is missing - nothing would translate the interface'; exit 1 }

      - name: Check update manifest
        shell: pwsh
        run: |
          # the app only accepts 'name=version|url|sha256;', so a broken line must never reach the default branch unnoticed
          $line = (Get-Content memreduct/VERSION -Raw).Trim()

          if ($line -match '^memreduct=[0-9.]+\|[^|]+\|[0-9a-f]{64};$') {
            Write-Host "update manifest ok"
          } elseif ($line -match '^memreduct=[0-9.]+\|[^|]+;$') {
            Write-Warning 'VERSION has no sha256 field: the in-app updater refuses such a manifest.'
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "**VERSION has no sha256 field** - the updater will report an invalid manifest until the line printed by the release job is pasted into it."
          } else {
            Write-Error "VERSION is not a 'name=version|url[|sha256];' record: $line"
            exit 1
          }

          $url = ($line -split '\|')[1]
          if (-not $url.StartsWith("https://github.com/$env:GITHUB_REPOSITORY/releases/download/")) {
            Write-Error "the installer url must point at this repository, got $url"
            exit 1
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[18.0,19.0)'

      - name: Build x64
        shell: cmd
        working-directory: memreduct
        run: msbuild memreduct.sln -property:Configuration=Release -property:Platform=x64 -property:OutDir=bin\64\ -property:IntDir=obj\64\ -verbosity:minimal

      - name: Build ARM64
        shell: cmd
        working-directory: memreduct
        run: msbuild memreduct.sln -property:Configuration=Release -property:Platform=ARM64 -property:OutDir=bin\arm64\ -property:IntDir=obj\arm64\ -verbosity:minimal

      - name: Show binaries
        shell: pwsh
        run: Get-ChildItem -Recurse memreduct/bin -Include *.exe, *.pdb | Select-Object FullName, Length

      - name: Install packaging tools
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
          "C:\Program Files\7-Zip" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Package
        shell: pwsh
        working-directory: builder
        run: |
          python src/build_package.py --name-short=$env:APP_NAME_SHORT --version=${{ steps.version.outputs.version }} --name="$env:APP_NAME"

      - name: Create portable zip
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $stage = Join-Path $env:TEMP 'portable\memreduct'
          $desktop = Join-Path $env:USERPROFILE 'Desktop'
          $zip = Join-Path $desktop ("memreduct-$version-bin.zip")

          # builder removes its own staging folder, so the archive is packed straight from the compiled binaries
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }

          New-Item -ItemType Directory -Force -Path (Join-Path $stage '64'), (Join-Path $stage 'arm64') | Out-Null

          $binaries = Get-ChildItem -Path memreduct/bin -Recurse -Filter memreduct.exe
          $exe64 = $binaries | Where-Object { $_.FullName -notmatch 'arm64' } | Select-Object -First 1
          $exearm = $binaries | Where-Object { $_.FullName -match 'arm64' } | Select-Object -First 1

          if (-not $exe64 -or -not $exearm) { Write-Error 'no compiled memreduct.exe under memreduct/bin'; exit 1 }

          Copy-Item $exe64.FullName (Join-Path $stage '64') -Force
          Copy-Item $exearm.FullName (Join-Path $stage 'arm64') -Force
          Copy-Item memreduct/bin/memreduct.lng, memreduct/bin/License.txt, memreduct/bin/Readme.txt $stage -Force

          if (Test-Path $zip) { Remove-Item $zip -Force }

          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal

          Get-ChildItem -Recurse $stage | Select-Object FullName, Length
          Get-ChildItem $desktop -Filter 'memreduct-*' | Select-Object Name, Length

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $desktop = Join-Path $env:USERPROFILE 'Desktop'
          $version = '${{ steps.version.outputs.version }}'
          foreach ($pattern in @("memreduct-$version-setup.exe", "memreduct-$version-bin.zip")) {
            $found = Get-ChildItem -Path $desktop -Filter $pattern -ErrorAction SilentlyContinue
            if ($found) { Copy-Item $found.FullName dist/ -Force }
          }
          Get-ChildItem dist

      - name: Publish update manifest line
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $setup = Join-Path (Get-Location) "dist/memreduct-$version-setup.exe"
          if (-not (Test-Path $setup)) { Write-Error "missing $setup"; exit 1 }
          $sha = (Get-FileHash -Path $setup -Algorithm SHA256).Hash.ToLower()
          # the release asset lives under the tag name, which is always "v." + APP_VERSION
          $line = "memreduct=$version|https://github.com/$env:GITHUB_REPOSITORY/releases/download/v.$version/memreduct-$version-setup.exe|$sha;"
          Write-Host $line
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### VERSION line (installer is verified against this sha256)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $line
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Paste this line into VERSION on branch main after pushing the v.$version tag."

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: memreduct-${{ steps.version.outputs.version }}-windows
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v.')
    permissions:
      contents: write
      actions: read
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path src/app.h -Pattern 'APP_VERSION\s+L"([0-9.]+)"' | Select-Object -First 1
          if (-not $match) { Write-Error 'APP_VERSION not found in src/app.h'; exit 1 }
          $version = $match.Matches[0].Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($env:GITHUB_REF_NAME -ne "v.$version") {
            Write-Error "tag '$($env:GITHUB_REF_NAME)' does not match v.$version (APP_VERSION)"
            exit 1
          }

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: memreduct-${{ steps.version.outputs.version }}-windows
          path: dist

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = (Get-ChildItem dist -File).FullName

          if (-not $assets) { Write-Error 'dist is empty'; exit 1 }

          # a re-run for the same tag must not fail, so top up the assets of the release that already exists
          gh release create "$env:GITHUB_REF_NAME" --verify-tag --title "Mem Reduct ${{ steps.version.outputs.version }}" --generate-notes --latest $assets
          if ($LASTEXITCODE -ne 0) { gh release upload "$env:GITHUB_REF_NAME" $assets --clobber }
