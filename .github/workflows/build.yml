name: build

on:
  push:
    branches: [main, master]
    tags: ['v.*']
    paths-ignore: ['**.md', 'bin/i18n/**', 'images/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME_SHORT: memreduct
  APP_NAME: Mem Reduct
  # this is the branch the application downloads VERSION from (UPDATE_MANIFEST_URL in src/main.h)
  UPDATE_CHANNEL_BRANCH: main

jobs:
  build:
    permissions:
      contents: read
      actions: write
    # v145 toolset needs visual studio 2026, which only this image carries
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout application
        uses: actions/checkout@v7
        with:
          path: memreduct

      - name: Checkout routine
        uses: actions/checkout@v7
        with:
          repository: henrypp/routine
          ref: 1acd9394395b7cee9e1ea7b985fb54e76be86b11
          path: routine

      - name: Checkout builder
        uses: actions/checkout@v7
        with:
          repository: henrypp/builder
          ref: 124afc79ce0462170d66df1922be5944dea85dfb
          path: builder

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path memreduct/src/app.h -Pattern 'APP_VERSION\s+L"([0-9.]+)"' | Select-Object -First 1
          if (-not $match) { Write-Error 'APP_VERSION not found in src/app.h'; exit 1 }
          $version = $match.Matches[0].Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          # the installer url is built from APP_VERSION, so a disagreeing tag would break every self-update
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v.$version") {
            Write-Error "tag '$($env:GITHUB_REF_NAME)' does not match v.$version (APP_VERSION)"
            exit 1
          }

      - name: Check locale pack
        shell: pwsh
        run: |
          if (-not (Test-Path memreduct/bin/memreduct.lng)) { Write-Error 'memreduct/bin/memreduct.lng is missing - nothing would translate the interface'; exit 1 }

      - name: Check update manifest
        shell: pwsh
        run: |
          # the app only accepts 'name=version|url|sha256;', so a broken line must never reach the default branch unnoticed
          $line = (Get-Content memreduct/VERSION -Raw).Trim()

          if ($line -match '^memreduct=[0-9.]+\|[^|]+\|[0-9a-f]{64};$') {
            Write-Host "update manifest ok"
          } elseif ($line -match '^memreduct=[0-9.]+\|[^|]+;$') {
            Write-Warning 'VERSION has no sha256 field: the in-app updater refuses such a manifest.'
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "**VERSION has no sha256 field** - the updater reports an invalid manifest until a release has been published, which writes the field."
          } else {
            Write-Error "VERSION is not a 'name=version|url[|sha256];' record: $line"
            exit 1
          }

          $url = ($line -split '\|')[1]
          if (-not $url.StartsWith("https://github.com/$env:GITHUB_REPOSITORY/releases/download/")) {
            Write-Error "the installer url must point at this repository, got $url"
            exit 1
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[18.0,19.0)'

      - name: Build x64
        shell: cmd
        working-directory: memreduct
        run: msbuild memreduct.sln -property:Configuration=Release -property:Platform=x64 -property:OutDir=bin\64\ -property:IntDir=obj\64\ -verbosity:minimal

      - name: Build x86
        shell: cmd
        working-directory: memreduct
        run: msbuild memreduct.sln -property:Configuration=Release -property:Platform=Win32 -property:OutDir=bin\32\ -property:IntDir=obj\32\ -verbosity:minimal

      - name: Check the built binaries
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $failure = @()
          # running the executable would pop a self elevating gui on the runner, so the headers are read instead
          $expect = @(
            @('memreduct/bin/32/memreduct.exe', 0x14c),
            @('memreduct/bin/64/memreduct.exe', 0x8664)
          )

          foreach ($item in $expect) {
            $path = $item[0]

            if (-not (Test-Path $path)) { $failure += "missing $path"; continue }

            $bytes = [System.IO.File]::ReadAllBytes($path)
            $header = [BitConverter]::ToInt32($bytes, 0x3C)

            if ([BitConverter]::ToUInt16($bytes, 0) -ne 0x5A4D) { $failure += "$path is not an MZ executable" }
            if ([BitConverter]::ToUInt32($bytes, $header) -ne 0x00004550) { $failure += "$path has no PE signature" }

            $machine = [BitConverter]::ToUInt16($bytes, $header + 4)
            $subsystem = [BitConverter]::ToUInt16($bytes, $header + 92)
            $dllcharacteristics = [BitConverter]::ToUInt16($bytes, $header + 94)

            if ($machine -ne $item[1]) {
              $failure += ("{0} is machine 0x{1:x4} but 0x{2:x4} was built for it - the two platforms landed in the same folder" -f $path, $machine, $item[1])
            }

            if ($subsystem -ne 2) { $failure += "$path subsystem is $subsystem, 2 (windows gui) is expected" }

            $info = (Get-Item $path).VersionInfo

            if (-not $info.FileVersion.StartsWith($version)) { $failure += "$path FileVersion is '$($info.FileVersion)' but APP_VERSION is $version" }

            [PSCustomObject]@{
              Binary = $path
              Machine = ('0x{0:x4}' -f $machine)
              Subsystem = $subsystem
              DllCharacteristics = ('0x{0:x4}' -f $dllcharacteristics)
              FileVersion = $info.FileVersion
              ProductName = $info.ProductName
              Bytes = (Get-Item $path).Length
            }
          }

          if ($failure) {
            $failure | ForEach-Object { Write-Host "::error=$_" }

            exit 1
          }

      - name: Show binaries
        shell: pwsh
        run: Get-ChildItem -Recurse memreduct/bin -Include *.exe, *.pdb | Select-Object FullName, Length

      - name: Install packaging tools
        shell: pwsh
        run: |
          choco install nsis --no-progress -y

          # the compiler sits in a different folder for the 32-bit and for the 64-bit package, so it is looked up
          $makensis = Get-ChildItem 'C:\Program Files (x86)\NSIS', 'C:\Program Files\NSIS' -Filter 'makensis.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not $makensis) { Write-Error 'makensis.exe was not found - the nsis package did not install'; exit 1 }

          $makensis.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append
          $makensis.FullName

      - name: Stage packages
        id: stage
        shell: pwsh
        run: |
          $stage = Join-Path $env:TEMP 'pkg\memreduct'
          $out = Join-Path $env:TEMP 'pkg\out'

          "stage=$stage" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "out=$out" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          New-Item -ItemType Directory -Force -Path (Join-Path $stage '32'), (Join-Path $stage '64') | Out-Null

          foreach ($binary in @('memreduct/bin/64/memreduct.exe', 'memreduct/bin/32/memreduct.exe')) {
            if (-not (Test-Path $binary)) { Write-Error "missing $binary - the build step did not produce it"; exit 1 }
          }

          Copy-Item memreduct/bin/64/memreduct.exe (Join-Path $stage '64') -Force
          Copy-Item memreduct/bin/32/memreduct.exe (Join-Path $stage '32') -Force

          # the installer reads its license and locale pack from the 64-bit folder, the archive keeps them everywhere
          foreach ($document in @('History.txt', 'License.txt', 'Readme.txt', 'memreduct.lng')) {
            $source = Join-Path 'memreduct/bin' $document

            if (-not (Test-Path $source)) { Write-Error "missing $source"; exit 1 }

            Copy-Item $source $stage -Force
            Copy-Item $source (Join-Path $stage '32') -Force
            Copy-Item $source (Join-Path $stage '64') -Force
          }

          # portable mode is switched on by this marker, so it must sit next to every archived binary
          foreach ($architecture in @('32', '64')) {
            Set-Content -Path (Join-Path $stage ($architecture + '\portable.dat')) -Value '#PORTABLE#' -NoNewline -Encoding ascii
          }

          Get-ChildItem -Recurse $stage | Select-Object FullName, Length

      - name: Adapt the installer script to this fork
        shell: pwsh
        working-directory: builder
        run: |
          $nsi = 'src/setup_script.nsi'
          $text = Get-Content -Path $nsi -Raw

          $nl = "`n"
          if ($text.Contains("`r`n")) { $nl = "`r`n" }

          # builder ships a 64-bit and an ARM64 payload, this fork ships a 32-bit and a 64-bit one
          $selection = [regex]::Match($text, '(?s)\$\{If\} \$\{IsNativeARM64\}.*?\$\{EndIf\}')

          if (-not $selection.Success) { Write-Error 'the arm64 selection block is gone - builder changed its script'; exit 1 }

          $payload = @'
          ${If} ${RunningX64}
            File "${APP_FILES_DIR}\64\${APP_NAME_SHORT}.exe"
            ${Else}
            File "${APP_FILES_DIR}\32\${APP_NAME_SHORT}.exe"
            ${EndIf}
          '@

          $text = $text.Replace($selection.Value, (($payload.Trim()) -replace "`r?`n", $nl))

          if ($text.Contains('IsNativeARM64')) { Write-Error 'an arm64 reference is left in the installer script'; exit 1 }

          # builder still lets Windows 7 install, but the app needs the Windows 10 memory APIs
          # WinVer.nsh has no service pack granularity, so the gate is Windows 10; README states the tested 21H1 floor
          # the fork signs as Lumina, the original author stays in the copyright line
          foreach ($replacement in @(
            @('; Windows 7 and later only', '; Windows 10 and later only'),
            @('${IfNot} ${AtLeastWin7}', '${IfNot} ${AtLeastWin10}'),
            @('MessageBox MB_OK|MB_ICONEXCLAMATION ''$(RequireWindows7)''', 'MessageBox MB_OK|MB_ICONEXCLAMATION ''${APP_NAME} requires Windows 10 and later!'''),
            @('!define APP_AUTHOR         "Henry++"', '!define APP_AUTHOR         "Lumina"'),
            @('!define APP_WEBSITE        "https://github.com/henrypp"', '!define APP_WEBSITE        "https://github.com/ninokiru/Mem-Reduct"'),
            @('!define COPYRIGHT          "(c) ${CURRENT_YEAR} ${APP_AUTHOR}. All Rights Reversed."', '!define COPYRIGHT          "(c) ${CURRENT_YEAR} ${APP_AUTHOR}. Based on original work (c) 2011-2026 Henry++."'),
            # the lzma encoder rejects a 128 mb dictionary and the compiler dies with 'deflateInit() failed'
            @('SetCompressorDictSize 128', 'SetCompressorDictSize 64')
          )) {
            if (-not $text.Contains($replacement[0])) { Write-Error ("builder changed its script, cannot find: " + $replacement[0]); exit 1 }

            $text = $text.Replace($replacement[0], $replacement[1])
          }

          if ($text.Contains('AtLeastWin7') -or $text.Contains('RequireWindows7')) { Write-Error 'a windows 7 reference is left in the installer script'; exit 1 }

          # NSIS 3.11 and later generate the windows 10 test, so it is compiled instead of searched for in the header
          $probe = Join-Path $env:TEMP 'nsis_winver_probe.nsi'
          $probeOut = Join-Path $env:TEMP 'nsis_winver_probe.exe'

          if (Test-Path $probeOut) { Remove-Item $probeOut -Force }

          # the version test calls a function, which is only allowed inside a section or a function
          $probeBody = @'
          !include "WinVer.nsh"

          Function Probe
            ${If} ${AtLeastWin10}
              DetailPrint "windows 10 or later"
            ${EndIf}
          FunctionEnd

          Section "Probe"
            Call Probe
          SectionEnd
          '@

          # the output path belongs into the script, the command line would split it at every space
          ('OutFile "' + $probeOut + '"' + "`n" + $probeBody) | Set-Content -Path $probe -Encoding utf8NoBOM

          & makensis.exe /V2 $probe

          if ($LASTEXITCODE -ne 0) { Write-Error 'this NSIS cannot compile a windows 10 version test'; exit 1 }
          if (-not (Test-Path $probeOut)) { Write-Error 'the probe did not produce an output file'; exit 1 }

          # the builder script carries no output name, it used to come from the command line
          $setup = Join-Path '${{ steps.stage.outputs.out }}' ('memreduct-${{ steps.version.outputs.version }}-setup.exe')

          $text = 'OutFile "' + $setup + '"' + "`n" + $text

          Set-Content -Path $nsi -Value $text -NoNewline -Encoding utf8NoBOM

          Select-String -Path $nsi -Pattern 'APP_FILES_DIR|RunningX64|AtLeastWin|APP_AUTHOR|APP_WEBSITE' | Select-Object LineNumber, Line

      - name: Build installer
        shell: pwsh
        working-directory: builder
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $stage = '${{ steps.stage.outputs.stage }}'
          $out = '${{ steps.stage.outputs.out }}'
          $setup = Join-Path $out ("memreduct-$version-setup.exe")

          if (Test-Path $setup) { Remove-Item $setup -Force }

          # the same defines build_package.py passed to makensis, kept as one argument each
          # the output path is part of the installer script, the command line would split it at every space
          $options = @(
            '/V2',
            ('/DAPP_FILES_DIR=' + $stage),
            ('/DAPP_NAME=' + $env:APP_NAME),
            ('/DAPP_NAME_SHORT=' + $env:APP_NAME_SHORT),
            ('/DAPP_VERSION=' + $version),
            'src\setup_script.nsi'
          )

          & makensis.exe @options

          if ($LASTEXITCODE -ne 0) { Write-Error "makensis failed with exit code $LASTEXITCODE"; exit 1 }
          if (-not (Test-Path $setup)) { Write-Error "makensis did not produce $setup"; exit 1 }

          Get-Item $setup | Select-Object FullName, Length

      - name: Create portable zip
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $stage = '${{ steps.stage.outputs.stage }}'
          $out = '${{ steps.stage.outputs.out }}'
          $zip = Join-Path $out ("memreduct-$version-bin.zip")

          if (Test-Path $zip) { Remove-Item $zip -Force }

          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal

          Get-ChildItem $out -Filter 'memreduct-*' | Select-Object Name, Length

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $out = '${{ steps.stage.outputs.out }}'
          $version = '${{ steps.version.outputs.version }}'
          foreach ($pattern in @("memreduct-$version-setup.exe", "memreduct-$version-bin.zip")) {
            $found = Get-ChildItem -Path $out -Filter $pattern -ErrorAction SilentlyContinue
            if (-not $found) { Write-Error "missing $pattern in $out - packaging did not produce it"; exit 1 }
            Copy-Item $found.FullName dist/ -Force
          }
          Get-ChildItem dist

      - name: Publish update manifest line
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $setup = Join-Path (Get-Location) "dist/memreduct-$version-setup.exe"
          if (-not (Test-Path $setup)) { Write-Error "missing $setup"; exit 1 }
          $sha = (Get-FileHash -Path $setup -Algorithm SHA256).Hash.ToLower()
          # the release asset lives under the tag name, which is always "v." + APP_VERSION
          $line = "memreduct=$version|https://github.com/$env:GITHUB_REPOSITORY/releases/download/v.$version/memreduct-$version-setup.exe|$sha;"
          Write-Host $line
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### VERSION line (installer is verified against this sha256)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $line
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "The release job commits this line to VERSION on branch main once the tag is published."

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: memreduct-${{ steps.version.outputs.version }}-windows
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v.')
    permissions:
      contents: write
      actions: read
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout application
        uses: actions/checkout@v7

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path src/app.h -Pattern 'APP_VERSION\s+L"([0-9.]+)"' | Select-Object -First 1
          if (-not $match) { Write-Error 'APP_VERSION not found in src/app.h'; exit 1 }
          $version = $match.Matches[0].Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($env:GITHUB_REF_NAME -ne "v.$version") {
            Write-Error "tag '$($env:GITHUB_REF_NAME)' does not match v.$version (APP_VERSION)"
            exit 1
          }

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: memreduct-${{ steps.version.outputs.version }}-windows
          path: dist

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = (Get-ChildItem dist -File).FullName

          if (-not $assets) { Write-Error 'dist is empty'; exit 1 }

          # a re-run for the same tag must not fail, so top up the assets of the release that already exists
          gh release create "$env:GITHUB_REF_NAME" --verify-tag --title "Mem Reduct ${{ steps.version.outputs.version }}" --generate-notes --latest $assets
          if ($LASTEXITCODE -ne 0) { gh release upload "$env:GITHUB_REF_NAME" $assets --clobber }

      - name: Point VERSION at this release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $setup = "memreduct-$version-setup.exe"

          # the record promises a download url, so the asset has to be really there with exactly that address
          $release = (gh release view "$env:GITHUB_REF_NAME" --json assets | ConvertFrom-Json)

          if ($LASTEXITCODE -ne 0) { Write-Error 'could not read back the release'; exit 1 }

          $installer = $release.assets | Where-Object name -eq $setup

          if (-not $installer) { Write-Error "the release does not carry $setup"; exit 1 }

          $sha = (Get-FileHash -Path "dist/$setup" -Algorithm SHA256).Hash.ToLower()
          $line = "memreduct=$version|$($installer.url)|$sha;"

          if ($installer.url -ne "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$setup") {
            Write-Error "unexpected asset url: $($installer.url)"
            exit 1
          }

          # the file is replaced through the api, because this run is checked out at the tag, not at the channel branch
          $manifest = gh api "repos/$env:GITHUB_REPOSITORY/contents/VERSION?ref=$env:UPDATE_CHANNEL_BRANCH" | ConvertFrom-Json

          if ($LASTEXITCODE -ne 0) { Write-Error "could not read VERSION on $env:UPDATE_CHANNEL_BRANCH"; exit 1 }

          $current = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($manifest.content)).Trim()

          if ($current) {
            $published = ($current -split '\|')[0] -replace '^[^=]+=', ''

            try {
              if ([version]$published -gt [version]$version) {
                Write-Error "VERSION on $env:UPDATE_CHANNEL_BRANCH already points at $published - refusing to rewind the channel to $version"
                exit 1
              }
            }
            catch {
              Write-Host "VERSION on $env:UPDATE_CHANNEL_BRANCH is not a plain record, replacing it: $current"
            }
          }

          $content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($line))

          # one argument per element, so neither the message nor the base64 body can be split by the shell
          $call = @(
            'api',
            ("repos/{0}/contents/VERSION" -f $env:GITHUB_REPOSITORY),
            '-X', 'PUT',
            '-f', ('ref=' + $env:UPDATE_CHANNEL_BRANCH),
            '-f', ('message=VERSION: point the update channel at ' + $env:GITHUB_REF_NAME + ' [skip ci]'),
            '-f', ('content=' + $content),
            '-f', ('sha=' + $manifest.sha)
          )

          gh @call

          if ($LASTEXITCODE -ne 0) {
            Write-Error "the release is published but VERSION could not be committed on $env:UPDATE_CHANNEL_BRANCH - check branch protection"
            exit 1
          }

          Write-Host $line
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ('VERSION on branch ' + $env:UPDATE_CHANNEL_BRANCH + ' now serves **v' + $version + '** (sha256 ' + $sha + ').')
